<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13161B">
<title>لوحة تحكم H&H</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#13161B;--bg2:#181C22;--card:#1D2229;--card2:#262C34;--line:rgba(236,226,208,.09);--line2:rgba(236,226,208,.16);--tx:#EDE8DF;--tx2:#C9C4BA;--mut:#8E949D;--br:#C9A57C;--br2:#E4CBA6;--br3:rgba(201,165,124,.15);--ok:#86B795;--ok3:rgba(134,183,149,.14);--no:#D48E80;--no3:rgba(212,142,128,.14);--disp:'Reem Kufi',serif;--body:'IBM Plex Sans Arabic',system-ui,sans-serif;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--br2)}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:5;background:rgba(19,22,27,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;height:60px}
.logo{font:700 22px var(--disp);color:var(--br2);white-space:nowrap}
.logo small{font:500 13px var(--body);color:var(--mut);margin-inline-start:6px}
.ib{margin-inline-start:auto;display:flex;gap:6px}
.ib a,.ib button{height:40px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--tx2);text-decoration:none}
.btn{height:50px;padding:0 20px;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.btn.gold{background:linear-gradient(180deg,#D8B88C,#BC9567);color:#1A1612;border-color:transparent}
.btn.red{color:var(--no);border-color:rgba(212,142,128,.3)}
.btn.w{width:100%}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:12px 13px;outline:0;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--br)}
label.l{display:block;font-size:13.5px;color:var(--mut);margin:0 0 6px}
.f{margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:28px}
.login h1{font:700 30px var(--disp);color:var(--br2);margin:0}
.login p{color:var(--mut);margin:2px 0 22px}
.err{color:var(--no);font-size:14px;min-height:22px;margin-top:10px}
.add{margin:16px 0 12px}
.srch{position:relative;margin-bottom:10px}
.srch input{padding-inline-start:40px}
.srch svg{position:absolute;top:50%;inset-inline-start:13px;transform:translateY(-50%);color:var(--mut)}
.fl{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:12px}
.fl::-webkit-scrollbar{display:none}
.fl button{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13.5px;color:var(--tx2);white-space:nowrap}
.fl button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fl b{font-weight:500;opacity:.7;margin-inline-start:4px}
.list{display:flex;flex-direction:column;gap:8px;padding-bottom:calc(40px + var(--sb))}
.it{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px}
.it.dim{opacity:.55}
.top{display:flex;gap:11px;align-items:center;cursor:pointer}
.top img,.top .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--card2);flex:none}
.top .ph{display:grid;place-items:center;color:var(--mut);font-size:11px;text-align:center;line-height:1.3}
.top .t{flex:1;min-width:0}
.top b{display:block;font-weight:500;font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top .p{font:600 16px var(--disp);color:var(--br2)}
.top .p s{font:400 12.5px var(--body);color:var(--mut);margin-inline-start:6px}
.top .ed{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--tx2)}
.tgl{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.tgl button{height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:13.5px;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:6px}
.tgl button.ok{background:var(--ok3);border-color:rgba(134,183,149,.35);color:var(--ok)}
.tgl button.no{background:var(--no3);border-color:rgba(212,142,128,.35);color:var(--no)}
.tgl button.gd{background:var(--br3);border-color:rgba(201,165,124,.4);color:var(--br2)}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.more{display:block;width:100%;padding:14px;color:var(--mut);font-size:14px}
.sh{position:fixed;inset:0;z-index:20;background:rgba(5,7,9,.62);display:flex;align-items:flex-end;justify-content:center}
.pane{width:100%;max-width:620px;max-height:96vh;overflow:auto;background:#191D23;border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + var(--sb))}
.ph2{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ph2 h2{font:700 20px var(--disp);margin:0}
.ph2 button{margin-inline-start:auto;height:38px;padding:0 14px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:14px}
.imgs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.imgs .im{position:relative;flex:none;width:92px;height:92px;border-radius:13px;overflow:hidden;border:2px solid transparent}
.imgs .im.main{border-color:var(--br)}
.imgs img{width:100%;height:100%;object-fit:cover}
.imgs .x{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:14px}
.imgs .mn{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.62);color:#fff;font-size:11.5px;padding:3px 0;text-align:center}
.imgs .up{flex:none;width:92px;height:92px;border-radius:13px;border:1.5px dashed var(--line2);display:grid;place-items:center;color:var(--mut);font-size:13px;text-align:center;cursor:pointer}
.sws{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-radius:13px;background:var(--bg);border:1px solid var(--line2);font-size:14.5px;cursor:pointer}
.sw input{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--card2);position:relative;flex:none;border:0;padding:0;transition:background .2s}
.sw input:before{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:transform .2s,background .2s}
.sw input:checked{background:var(--br)}
.sw input:checked:before{transform:translateX(-18px);background:#1A1612}
details.adv{border:1px solid var(--line);border-radius:14px;padding:0 13px;margin-bottom:14px}
details.adv summary{padding:13px 0;cursor:pointer;color:var(--tx2);font-size:14.5px}
.aib{background:var(--br3);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--tx2);margin-bottom:12px}
.act{position:sticky;bottom:calc(-16px - var(--sb));display:flex;gap:8px;padding:12px 0 calc(16px + var(--sb));margin-bottom:calc(-16px - var(--sb));background:#191D23;border-top:1px solid var(--line)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font:700 16px var(--disp);margin:0 0 12px}
.hint{font-size:12.5px;color:var(--mut);margin:6px 0 0}
.toast{position:fixed;bottom:calc(22px + var(--sb));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:13px;font-weight:500;display:none;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
@media(min-width:700px){.sh{align-items:center}.pane{border-radius:22px;border-bottom:1px solid var(--line2)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{
const A=window.HHAPI||'';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toLocaleString('en');
const num=v=>+String(v||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'')||0;
let TOK='';try{TOK=localStorage.getItem('hhadm')||''}catch(e){}
let ST=null,F='all',Q='',LIM=60;
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)};
async function api(op,body,raw){
  let r;
  try{r=await fetch(A+'/api/admin/'+op,{method:'POST',headers:raw?{authorization:'Bearer '+TOK,'content-type':raw}:{authorization:'Bearer '+TOK,'content-type':'application/json'},body:raw?body:JSON.stringify(body||{})});}
  catch(e){toast('ما كو اتصال بالإنترنت، حاول مرة ثانية');throw e}
  const j=await r.json().catch(()=>({err:'net'}));
  if(j.err==='auth'){TOK='';try{localStorage.removeItem('hhadm')}catch(e){}login();throw new Error('auth')}
  return j;
}
const ICON={pen:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
 gear:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 eye:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'};

function login(){
  $('#app').innerHTML=`<div class="login"><form id="lf"><h1>H&amp;H</h1><p>لوحة التحكم بالمتجر</p><div class="f"><label class="l" for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" required></div><button class="btn gold w">دخول</button><div class="err" id="le"></div></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';
    const r=await fetch(A+'/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pw:$('#pw').value})}).then(r=>r.json()).catch(()=>({err:'net'}));
    if(r.ok){TOK=r.tok;try{localStorage.setItem('hhadm',TOK)}catch(e){}boot()}else $('#le').textContent=r.err==='wait'?'محاولات كثيرة. انتظر ربع ساعة وحاول مرة ثانية.':r.err==='net'?'ما كو اتصال. تأكد من الإنترنت.':'كلمة المرور غير صحيحة.';};
  $('#pw').focus();
}
async function boot(){if(!TOK)return login();try{ST=await api('state')}catch(e){return}main()}
async function reload(){ST=await api('state');draw()}

const live=()=>ST.p.filter(p=>!p.del&&!p.dup);
const FL=[['all','الكل',p=>true],['offer','العروض',p=>p.offer],['pin','بالأعلى',p=>p.pin],['out','خلص',p=>!p.avail],['hid','مخفي',p=>p.hidden],['noimg','بدون صور',p=>!p.imgs.length],['del','المحذوف',null]];
function main(){
  $('#app').innerHTML=`<header><div class="wrap"><span class="logo">H&amp;H<small>لوحة التحكم</small></span><div class="ib"><a href="/" target="_blank">${ICON.eye}الموقع</a><button id="set">${ICON.gear}الإعدادات</button></div></div></header>
  <main class="wrap"><div class="add"><button class="btn gold w" id="add">＋ إضافة منتج جديد</button></div>
  <div class="srch">${ICON.search}<input id="q" type="search" placeholder="ابحث عن منتج…" value="${esc(Q)}"></div>
  <div class="fl" id="fl"></div><div class="list" id="ls"></div></main>`;
  $('#add').onclick=()=>edit(null);$('#set').onclick=settings;
  $('#q').oninput=e=>{Q=e.target.value;LIM=60;draw()};
  draw();
}
function draw(){
  const L=live();
  $('#fl').innerHTML=FL.map(([k,t,f])=>`<button data-f="${k}" class="${F===k?'on':''}">${t}<b>${k==='del'?ST.p.filter(p=>p.del).length:L.filter(f).length}</b></button>`).join('');
  $$('#fl button').forEach(b=>b.onclick=()=>{F=b.dataset.f;LIM=60;draw()});
  let l=F==='del'?ST.p.filter(p=>p.del):L.filter(FL.find(x=>x[0]===F)[2]);
  const q=Q.trim().toLowerCase();if(q)l=l.filter(p=>(p.name+' '+(p.brand||'')+' '+p.cat).toLowerCase().includes(q));
  l.sort((a,b)=>(b.pin||0)-(a.pin||0)||String(b.dt||'').localeCompare(String(a.dt||'')));
  $('#ls').innerHTML=l.slice(0,LIM).map(row).join('')+(l.length>LIM?`<button class="more" id="more">عرض المزيد (${l.length-LIM})</button>`:'')||'<div class="empty">ما كو منتجات هنا.</div>';
  if($('#more'))$('#more').onclick=()=>{LIM+=60;draw()};
  $$('#ls .it').forEach(el=>{const p=ST.p.find(x=>x.id===el.dataset.id);
    el.querySelector('.top').onclick=()=>edit(p);
    el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>quick(p,b.dataset.t));
    const r=el.querySelector('[data-r]');if(r)r.onclick=()=>restore(p);});
}
function row(p){
  const img=p.imgs[0]?`<img src="${A}/img/${esc(p.imgs[0])}" loading="lazy" alt="">`:'<span class="ph">بدون صورة</span>';
  return `<div class="it${p.hidden||p.del?' dim':''}" data-id="${esc(p.id)}"><div class="top">${img}<div class="t"><b>${esc(p.name)}</b><span class="p">${fmt(p.price)} د.ع${p.old>p.price?`<s>${fmt(p.old)}</s>`:''}</span>${p.hidden?'<div class="note">مخفي عن الزبائن</div>':''}</div><span class="ed" aria-label="تعديل">${ICON.pen}</span></div>
  ${p.del?`<div class="tgl" style="grid-template-columns:1fr"><button data-r>استرجاع المنتج</button></div>`:`<div class="tgl"><button data-t="avail" class="${p.avail?'ok':'no'}">${p.avail?'✓ متوفر':'✕ خلص'}</button><button data-t="offer" class="${p.offer?'gd':''}">${p.offer?'★ عرض':'☆ عرض'}</button><button data-t="pin" class="${p.pin?'gd':''}">${p.pin?'▲ بالأعلى':'△ أولاً'}</button></div>`}</div>`;
}
async function quick(p,k){
  const v=p[k]?0:1;p[k]=v;draw();
  const r=await api('save',{id:p.id,ov:{[k]:v}}).catch(()=>null);
  if(r&&r.ok)toast(k==='avail'?(v?'رجع متوفر':'انحفظ: خلص من المحل'):k==='offer'?(v?'صار عرض':'انشال من العروض'):(v?'صار يظهر أولاً':'رجع لمكانه'));
  else{p[k]=v?0:1;draw();toast('ما انحفظ، حاول مرة ثانية')}
}
async function restore(p){await api('save',{id:p.id,ov:{del:null}});toast('رجع المنتج');reload()}

function sheet(html){const d=document.createElement('div');d.className='sh';d.innerHTML=`<div class="pane">${html}</div>`;document.body.append(d);document.body.style.overflow='hidden';
  const close=()=>{d.remove();document.body.style.overflow=''};d.onclick=e=>{if(e.target===d)close()};const x=d.querySelector('[data-close]');if(x)x.onclick=close;return {d,close};}

function edit(p){
  const n=!p;p=p||{name:'',price:'',old:'',cat:(ST.cats[0]||{}).n,brand:'',avail:1,offer:0,pin:0,hidden:0,warranty:'سنة',feats:'',desc:'',specs:[],imgs:[]};
  let imgs=[...(p.imgs||[])];
  const {d,close}=sheet(`<div class="ph2"><h2>${n?'منتج جديد':'تعديل المنتج'}</h2><button data-close>إغلاق</button></div>
  <div class="f"><label class="l">الصور — اضغط على صورة حتى تصير الرئيسية</label><div class="imgs" id="im"></div></div>
  <div class="f"><label class="l" for="e_name">اسم المنتج</label><input id="e_name" value="${esc(p.name)}" placeholder="مثال: شاحن انكر 20 واط"></div>
  <div class="g2"><div class="f"><label class="l" for="e_price">السعر (دينار)</label><input id="e_price" inputmode="numeric" value="${p.price||''}" placeholder="25000"></div><div class="f"><label class="l" for="e_old">السعر قبل الخصم</label><input id="e_old" inputmode="numeric" value="${p.old||''}" placeholder="اختياري"></div></div>
  <div class="f"><label class="l" for="e_cat">القسم</label><select id="e_cat">${ST.cats.map(c=>`<option ${c.n===p.cat?'selected':''}>${esc(c.n)}</option>`).join('')}</select></div>
  <div class="sws"><label class="sw">متوفر<input type="checkbox" id="e_avail" ${p.avail?'checked':''}></label><label class="sw">عرض<input type="checkbox" id="e_offer" ${p.offer?'checked':''}></label><label class="sw">يظهر أولاً<input type="checkbox" id="e_pin" ${p.pin?'checked':''}></label><label class="sw">إخفاء<input type="checkbox" id="e_hid" ${p.hidden?'checked':''}></label></div>
  <details class="adv"><summary>تفاصيل أكثر (الوصف، المواصفات، الضمان)</summary>
   <div class="g2"><div class="f"><label class="l" for="e_war">الضمان</label><select id="e_war"><option value="سنة">ضمان سنة</option><option value="فحص وتشغيل">فحص وتشغيل</option><option value="">بدون</option></select></div><div class="f"><label class="l" for="e_brand">الماركة</label><input id="e_brand" value="${esc(p.brand||'')}"></div></div>
   <div class="f"><label class="l" for="e_desc">الوصف</label><textarea id="e_desc" rows="4">${esc(p.desc||'')}</textarea></div>
   <div class="f"><label class="l" for="e_specs">المواصفات — كل سطر: الاسم: القيمة</label><textarea id="e_specs" rows="5" placeholder="القدرة: 20 واط&#10;المنفذ: USB-C">${esc((p.specs||[]).map(s=>s[0]+': '+s[1]).join('\n'))}</textarea></div>
   <div class="f"><label class="l" for="e_feats">كلمات مميزة تظهر على المنتج (بينها |)</label><input id="e_feats" value="${esc(p.feats||'')}" placeholder="20W|USB-C|ضمان سنة"></div>
   ${!n&&ST.ai?`<div class="aib">${p.ai&&p.ai.specs&&p.ai.specs.length?'مواصفات الذكاء الاصطناعي: '+esc(p.ai.specs.map(s=>s[0]+': '+s[1]).join('، ')):'الذكاء الاصطناعي راح يكتب مواصفات إضافية خلال دقائق.'} <button id="reai" style="color:var(--br2);text-decoration:underline">أعد كتابتها</button></div>`:''}
   ${p.post?`<p class="hint">مأخوذ من منشور القناة: <a href="https://t.me/${esc(ST.s.tgChannel)}/${p.post}" target="_blank">افتح المنشور</a></p>`:''}
  </details>
  <div class="act"><button class="btn gold" id="sv" style="flex:1">حفظ</button>${n?'':`<button class="btn red" id="dl">حذف</button>`}</div>`);
  const v=s=>d.querySelector(s);
  v('#e_war').value=p.warranty||'';
  const drawIm=()=>{v('#im').innerHTML=imgs.map((k,i)=>`<div class="im${i?'':' main'}" data-i="${i}"><img src="${A}/img/${esc(k)}" alt="">${i?'':'<span class="mn">الرئيسية</span>'}<button class="x" data-x="${i}" aria-label="احذف الصورة">✕</button></div>`).join('')+`<label class="up">＋<br>إضافة صور<input type="file" accept="image/*" multiple hidden id="up"></label>`;
    d.querySelectorAll('.im').forEach(el=>el.onclick=e=>{if(e.target.closest('.x'))return;const i=+el.dataset.i;imgs.unshift(imgs.splice(i,1)[0]);drawIm()});
    d.querySelectorAll('.x').forEach(b=>b.onclick=()=>{imgs.splice(+b.dataset.x,1);drawIm()});
    v('#up').onchange=async e=>{const fs=[...e.target.files];for(let i=0;i<fs.length;i++){toast(`جاري رفع الصورة ${i+1} من ${fs.length}…`);try{const b=await shrink(fs[i]);const r=await api('upload',b,'image/jpeg');if(r.k){imgs.push(r.k);drawIm()}else toast('الصورة كبيرة جداً')}catch(e){}}toast('انرفعت الصور — لا تنسى تدوس حفظ')};};
  drawIm();
  v('#sv').onclick=async()=>{
    const ov={name:v('#e_name').value.trim(),price:num(v('#e_price').value),old:num(v('#e_old').value),cat:v('#e_cat').value,avail:v('#e_avail').checked?1:0,offer:v('#e_offer').checked?1:0,pin:v('#e_pin').checked?1:0,hidden:v('#e_hid').checked?1:0,
      warranty:v('#e_war').value,brand:v('#e_brand').value.trim(),desc:v('#e_desc').value.trim(),feats:v('#e_feats').value.trim(),imgs,
      specs:v('#e_specs').value.split('\n').map(l=>l.split(/[:：](.*)/s)).filter(x=>x[0].trim()&&x[1]&&x[1].trim()).map(x=>[x[0].trim(),x[1].trim()])};
    if(!ov.name){toast('اكتب اسم المنتج');v('#e_name').focus();return}
    if(!ov.price){toast('اكتب السعر');v('#e_price').focus();return}
    if(!imgs.length&&!confirm('المنتج بدون صور ما يظهر بالموقع. تحفظه هيچ؟'))return;
    v('#sv').disabled=true;v('#sv').textContent='جاري الحفظ…';
    const r=await api('save',{id:n?null:p.id,ov}).catch(()=>null);
    if(r&&r.ok){toast(n?'انضاف المنتج — يظهر بالموقع خلال دقيقة':'انحفظ — يظهر بالموقع خلال دقيقة');close();reload()}else{v('#sv').disabled=false;v('#sv').textContent='حفظ';toast('ما انحفظ، حاول مرة ثانية')}};
  if(v('#dl'))v('#dl').onclick=async()=>{if(!confirm('تحذف «'+p.name+'» من الموقع؟\nتگدر ترجعه بعدين من «المحذوف».'))return;await api('save',{id:p.id,ov:{del:1}});toast('انحذف المنتج');close();reload()};
  if(v('#reai'))v('#reai').onclick=async()=>{await api('ai',{id:p.id});toast('راح تنكتب مواصفات جديدة خلال دقائق')};
}
function shrink(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.86)};im.onerror=rej;im.src=URL.createObjectURL(f)})}

function settings(){
  const s=ST.s;const last=s._lastSync?new Date(s._lastSync).toLocaleString('ar-IQ',{hour:'numeric',minute:'2-digit',day:'numeric',month:'numeric'}):'—';
  const F=[['wa1','واتساب ١ (مثال 9647730001588)'],['wa2','واتساب ٢'],['tgUser','معرف تليجرام للمراسلة (بدون @)'],['ig','انستغرام (بدون @)'],['tt','تيك توك (بدون @)'],['fb','صفحة الماسنجر'],['address','العنوان'],['delivery','التوصيل'],['notice','شريط إعلان أعلى الموقع (فارغ = مخفي)']];
  const {d,close}=sheet(`<div class="ph2"><h2>الإعدادات</h2><button data-close>إغلاق</button></div>
  <div class="card"><h3>المزامنة مع قناة التليجرام</h3><p class="hint" style="margin:0 0 10px">الموقع يسحب منشورات القناة وحده كل ٣ دقائق. آخر مزامنة: ${last}</p><button class="btn w" id="sy">اسحب من القناة الآن</button></div>
  <div class="card"><h3>معلومات التواصل</h3>${F.map(([k,l])=>`<div class="f"><label class="l">${l}</label><input data-k="${k}" value="${esc(s[k]??'')}"></div>`).join('')}<button class="btn gold w" id="ss">حفظ المعلومات</button></div>
  <div class="card"><h3>الأقسام</h3><p class="hint" style="margin:0 0 8px">كل سطر قسم، بالترتيب اللي يظهر بالموقع.</p><textarea id="cats" rows="8">${esc(ST.cats.map(c=>c.n).join('\n'))}</textarea><button class="btn w" id="sc" style="margin-top:10px">حفظ الأقسام</button></div>
  <div class="card"><h3>كلمة المرور</h3><input id="np" type="password" placeholder="كلمة مرور جديدة (٨ أحرف أو أكثر)" autocomplete="new-password"><button class="btn w" id="cp" style="margin-top:10px">تغيير كلمة المرور</button></div>
  <div class="card"><h3>Google</h3><label class="l">رمز توثيق Google Search Console (اختياري)</label><input data-k="gsv" value="${esc(s.gsv||'')}" placeholder="الرمز اللي يعطيك ياه Google"><button class="btn w" id="sg" style="margin-top:10px">حفظ</button></div>
  <button class="btn red w" id="lo" style="margin-bottom:8px">تسجيل خروج</button>`);
  const v=q=>d.querySelector(q);
  v('#sy').onclick=async()=>{v('#sy').disabled=true;v('#sy').textContent='جاري السحب…';const r=await api('sync').catch(()=>({}));toast(r.ok?(r.made?`انضاف ${r.made} منتج جديد`:'كلشي محدّث'):'تعذّر، حاول بعد شوي');v('#sy').disabled=false;v('#sy').textContent='اسحب من القناة الآن';reload()};
  v('#ss').onclick=async()=>{const b={};d.querySelectorAll('.card [data-k]').forEach(i=>{if(i.dataset.k!=='gsv')b[i.dataset.k]=i.value.trim()});await api('settings',b);toast('انحفظت المعلومات');ST=await api('state')};
  v('#sg').onclick=async()=>{await api('settings',{gsv:v('[data-k=gsv]').value.trim().replace(/.*content="([^"]+)".*/,'$1')});toast('انحفظ')};
  v('#sc').onclick=async()=>{const old=Object.fromEntries(ST.cats.map(c=>[c.n,c.i]));const c=v('#cats').value.split('\n').map(x=>x.trim()).filter(Boolean).map(n=>({n,i:old[n]||'spark'}));await api('settings',{cats:c});toast('انحفظت الأقسام');reload()};
  v('#cp').onclick=async()=>{const r=await api('password',{pw:v('#np').value});if(r.ok){toast('تغيّرت كلمة المرور');close();setTimeout(()=>{TOK='';login()},900)}else toast('كلمة المرور لازم ٨ أحرف أو أكثر')};
  v('#lo').onclick=async()=>{await api('logout').catch(()=>{});TOK='';try{localStorage.removeItem('hhadm')}catch(e){}close();login()};
}
boot();
})();
</script>
