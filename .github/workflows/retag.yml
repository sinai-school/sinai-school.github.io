name: نقل وسم الإصدار
# يحرّك وسم الإصدار app لآخر commit بالفرع main (بدون إعادة بناء التطبيق) — حتى الوسم ما يبقى ماسك تاريخ قديم.
on:
  push:
    branches: [main]
    paths: ['ops/retag.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - run: |
          git tag -f app
          git push -f origin refs/tags/app
          git ls-remote origin refs/tags/app refs/heads/main
