name: متجر H&H — فحص
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/shop/**', '.github/workflows/shop-diag.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAW_TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '20'}
      - run: |
          export CLOUDFLARE_API_TOKEN=$(printf %s "$RAW_TOK" | python3 cf/tok.py)
          export CLOUDFLARE_ACCOUNT_ID=$(printf %s "$RAW_ACC" | tr -d '[:space:]"')
          node ops/shop/diag.mjs
