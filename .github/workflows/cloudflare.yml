name: خادم Cloudflare
on:
  push:
    branches: [main]
    paths: ['cf/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Deploy
        id: d
        run: |
          set -o pipefail
          L=log.txt; : > $L
          CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | python3 cf/tok.py)
          echo "has-bearer=$(printf %s "$CLOUDFLARE_API_TOKEN_RAW" | grep -c Bearer)" >> $L
          CLOUDFLARE_ACCOUNT_ID=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]"')
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          echo "tok-len=${#CLOUDFLARE_API_TOKEN} acc-len=${#CLOUDFLARE_ACCOUNT_ID} acc-hex=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$' && echo yes || echo no) tok-shape=$(printf %s "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]{30,60}$' && echo ok || echo odd)" >> $L
          [ -n "$CLOUDFLARE_API_TOKEN" ] || echo "MISSING CLOUDFLARE_API_TOKEN" >> $L
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || echo "MISSING CLOUDFLARE_ACCOUNT_ID" >> $L
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          AH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo "check: $(curl -s -H "$AH" https://api.cloudflare.com/client/v4/user/tokens/verify | head -c 300)" >> $L
          SUB=$(curl -s -H "$AH" $API/workers/subdomain | python3 -c 'import sys,json;print((json.load(sys.stdin).get("result") or {}).get("subdomain") or "")' || true)
          if [ -z "$SUB" ]; then
            for s in sinai-school sinai-school-iq sinai-iq-$RANDOM; do
              r=$(curl -s -X PUT -H "$AH" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$s\"}" $API/workers/subdomain)
              echo "subdomain $s: $(echo $r | head -c 200)" >> $L
              echo "$r" | grep -q '"success":true' && SUB=$s && break
            done
          fi
          echo "subdomain=$SUB" >> $L
          cd cf
          npx -y wrangler@3 d1 create sinai >> ../$L 2>&1 || true
          DBID=$(npx -y wrangler@3 d1 list --json 2>/dev/null | python3 -c 'import sys,json;print([d["uuid"] for d in json.load(sys.stdin) if d["name"]=="sinai"][0])' || true)
          echo "db=$DBID" >> ../$L
          printf 'name = "sinai"\nmain = "worker.js"\ncompatibility_date = "2024-09-23"\nworkers_dev = true\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "sinai"\ndatabase_id = "%s"\n[triggers]\ncrons = ["* * * * *"]\n' "$DBID" > wrangler.toml
          [ -f schema.sql ] && npx -y wrangler@3 d1 execute sinai --remote --file schema.sql -y >> ../$L 2>&1 || true
          npx -y wrangler@3 deploy >> ../$L 2>&1 || echo "DEPLOY FAILED" >> ../$L
          cd ..
          URL=https://sinai.$SUB.workers.dev
          sleep 5
          echo "url=$URL" >> $L
          echo "test: $(curl -s $URL | head -c 400)" >> $L
          echo "pk: $(curl -s $URL/pk)" >> $L
          echo "tst-s: $(curl -s -X POST -H 'Content-Type: text/plain' -d '{"a":"login","kind":"s","key":"tst-s","phone":"07000000001","nid":"200900000001"}' $URL | head -c 160)" >> $L
          echo "tst-t: $(curl -s -X POST -H 'Content-Type: text/plain' -d '{"a":"login","kind":"t","key":"tst-t","phone":"07000000002","nid":"199000000002"}' $URL | head -c 160)" >> $L
          (cd cf && npx -y wrangler@3 d1 execute sinai --remote --json --command "select d.t, count(distinct d.p) n, sum(length(c.d)) bytes from docs d join chunks c on c.id='d_'||d.p group by d.t" 2>/dev/null | python3 -c "import sys,json;print('sizes',json.load(sys.stdin)[0]['results'])") >> $L 2>&1 || true
          (cd cf && npx -y wrangler@3 d1 execute sinai --remote --json --command "select d.p, sum(length(c.d)) b from docs d join chunks c on c.id='d_'||d.p where d.t='docs' group by d.p order by b desc limit 8" 2>/dev/null | python3 -c "import sys,json;print('biggest',json.load(sys.stdin)[0]['results'])") >> $L 2>&1 || true
          if [ -f cf/boot.json ]; then python3 -u cf/boot.py $URL roles >> $L 2>&1 || echo "BOOT FAILED" >> $L; fi
          (cd cf && npx -y wrangler@3 d1 execute sinai --remote --json --command "select p, by, datetime(at/1000,'unixepoch') t from docs where at > (strftime('%s','now')-7200)*1000 order by at desc limit 25" 2>/dev/null | python3 -c "import sys,json;print('recent',json.load(sys.stdin)[0]['results'])") >> $L 2>&1 || true
          (cd cf && npx -y wrangler@3 d1 execute sinai --remote --json --command "select k, substr(v,1,40) v from kv where k in ('snapat','DREV')" 2>/dev/null | python3 -c "import sys,json;print('kv',json.load(sys.stdin)[0]['results'])") >> $L 2>&1 || true
          if [ -d cf/box ]; then python3 -u cf/boot.py $URL imp >> $L 2>&1 || echo "IMP FAILED" >> $L; fi
          if [ -f cf/cmp.json ]; then python3 -u cf/boot.py $URL cmp >> $L 2>&1 || echo "CMP FAILED" >> $L; fi
      - name: Report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s/$CLOUDFLARE_ACCOUNT_ID/ACC/g" log.txt || true
          grep -v -i 'api_token' log.txt > cf-status.txt || true
          git checkout --orphan cf-status-tmp
          git rm -rfq --cached . >/dev/null
          git add cf-status.txt
          git commit -qm "حالة خادم Cloudflare"
          git push -qf origin HEAD:cf-status
