name: نسخة الهواتف القديمة
on:
  push:
    branches: [main]
    paths: ['index.html', 'tools/legacy.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legacy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Build legacy.html
        run: |
          npm i --no-save --silent esbuild@0.24.0
          node tools/legacy.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy.html
          git diff --cached --quiet && exit 0
          git commit -qm "نسخة الهواتف القديمة (تلقائي)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
