name: نسخة الأرشيف (مشفّرة)
on:
  push:
    branches: [main]
    paths: ['ops/x207.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Run
        run: |
          pip install -q cryptography >/dev/null 2>&1 || true
          CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | python3 cf/tok.py)
          CLOUDFLARE_ACCOUNT_ID=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]"')
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          cd cf
          DBID=$(npx -y wrangler@3 d1 list --json 2>/dev/null | python3 -c 'import sys,json;print([d["uuid"] for d in json.load(sys.stdin) if d["name"]=="sinai"][0])')
          printf 'name = "sinai"\nmain = "worker.js"\ncompatibility_date = "2024-09-23"\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "sinai"\ndatabase_id = "%s"\n' "$DBID" > wrangler.toml
          cd ..
          python3 ops/x207.py /tmp/xout
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/xout
          cp ops/x207.json /tmp/req.json
          git checkout --orphan x207-out-tmp
          git rm -rfq --cached . >/dev/null
          cp /tmp/xout/*.json . 2>/dev/null || true
          for f in /tmp/xout/*.json; do git add -f "$(basename "$f")"; done; true
          git commit -qm "نسخة الأرشيف (مشفّرة)" || true
          git push -qf origin HEAD:$(python3 -c "import json;print(json.load(open('ops/x207.json')).get('out','x207-out'))")
