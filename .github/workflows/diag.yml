name: diag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      RAW_TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          T=$(printf %s "$RAW_TOK" | python3 cf/tok.py); A=$(printf %s "$RAW_ACC" | tr -d '[:space:]"')
          q(){ curl -s -X POST https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $T" -H 'Content-Type: application/json' --data "$1"; echo; }
          echo "== workers per day/script"
          q "{\"query\":\"{viewer{accounts(filter:{accountTag:\\\"$A\\\"}){workersInvocationsAdaptive(limit:100,filter:{date_geq:\\\"2026-10-26\\\"},orderBy:[date_ASC]){sum{requests errors subrequests} dimensions{date scriptName status}}}}}\"}" | python3 -c '
import sys,json
d=json.load(sys.stdin)
try:
  rows=d["data"]["viewer"]["accounts"][0]["workersInvocationsAdaptive"]
  for r in rows: print(r["dimensions"]["date"],r["dimensions"]["scriptName"],r["dimensions"]["status"],r["sum"])
except Exception as e: print(json.dumps(d)[:1500])'
          echo "== d1 per day"
          q "{\"query\":\"{viewer{accounts(filter:{accountTag:\\\"$A\\\"}){d1AnalyticsAdaptiveGroups(limit:100,filter:{date_geq:\\\"2026-10-26\\\"},orderBy:[date_ASC]){sum{readQueries writeQueries rowsRead rowsWritten} dimensions{date databaseId}}}}}\"}" | head -c 4000
          echo "== probes"
          SUB=$(curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain | python3 -c 'import sys,json;print(json.load(sys.stdin)["result"]["subdomain"])')
          for u in https://sinai.$SUB.workers.dev/ https://hh-shop.$SUB.workers.dev/ https://handhst.com/ https://sinai-school.github.io/; do curl -s -m 20 -o /tmp/b -w "$u %{http_code} %{time_total}\n" $u; head -c 200 /tmp/b; echo; done
          echo "== account plan"; curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts/$A/workers/account-settings | head -c 400; echo
          echo "== d1 list"; curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/d1/database" | python3 -c 'import sys,json;[print(x["uuid"],x["name"],x.get("file_size")) for x in json.load(sys.stdin)["result"]]'
