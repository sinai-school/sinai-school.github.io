name: diag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml','ops/diag.py']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          RAW_TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 ops/diag.py
