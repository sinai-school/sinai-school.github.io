name: صيانة البيانات
on:
  push:
    branches: [main]
    paths: ['ops/req.json', 'ops/in/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloudflare
  cancel-in-progress: false
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Run
        run: |
          pip install -q cryptography >/dev/null 2>&1 || true
          CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | python3 cf/tok.py)
          CLOUDFLARE_ACCOUNT_ID=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]"')
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API/workers/subdomain | python3 -c 'import sys,json;print((json.load(sys.stdin).get("result") or {}).get("subdomain") or "")')
          cd cf
          DBID=$(npx -y wrangler@3 d1 list --json 2>/dev/null | python3 -c 'import sys,json;print([d["uuid"] for d in json.load(sys.stdin) if d["name"]=="sinai"][0])')
          printf 'name = "sinai"\nmain = "worker.js"\ncompatibility_date = "2024-09-23"\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "sinai"\ndatabase_id = "%s"\n' "$DBID" > wrangler.toml
          cd ..
          python3 ops/run.py https://sinai.$SUB.workers.dev /tmp/opsout
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/opsout
          git checkout --orphan ops-out-tmp
          git rm -rfq --cached . >/dev/null
          cp /tmp/opsout/* . 2>/dev/null || true
          git add dump.json log.json 2>/dev/null || true
          git commit -qm "نتيجة الصيانة (مشفّرة)" || true
          git push -qf origin HEAD:ops-out
