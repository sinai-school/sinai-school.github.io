let DATA=clone(DATA0),SN=[...SN0],NS=SN.length,META={},ST=[],AT={},GD={},TT=null,TMS=null,CUR={};
let T=[],U=[],SH=[],B=[],g=[],R=[],STALE=0,GENING=0;
let DB=null,RO=0,LOC=null,READY={cfg:0,tt:0,st:0,at:0,gd:0,stf:0,let:0,off:0},HOLD=0,PEND=0,CURX=null;
const sh=(n,k)=>{const w=n.split(' ');return w.slice(0,(['عبد','ابو','أبو'].includes(w[1])?3:2)+k).join(' ')};
const keys=f=>{const k=[];for(let d=0;d<5;d++)for(let p=0;p<7;p++)if(f(d,p))k.push(d+','+p);return k};
function setSN(list){SN.splice(0,SN.length,...list);NS=SN.length}
function seedMeta(){[...new Set(DATA.map(e=>e[0]))].forEach(n=>{const m=META[n];if(m&&!m.bl)META[n]={bl:keys((d,p)=>(m.off||[]).includes(d)||(m.no1&&p==0))};else if(!m){const c=CON.find(x=>n.startsWith(x[0]));if(c)META[n]={bl:keys(c[1])}}})}
function build(){T=[];U=[];DATA.forEach(([n,sj,a])=>{let t=T.indexOf(n);if(t<0)t=T.push(n)-1;a.forEach(([s,h])=>{const secs=(Array.isArray(s)?[...s]:[s]).sort((x,y)=>x-y);if(secs.length&&secs.every(x=>x<NS))U.push({s:secs[0],secs,t,sj,h,cap:Math.ceil(h/5)})})});
  const S0=T.map(n=>sh(n,0));SH=T.map((n,i)=>S0.filter(x=>x==S0[i]).length>1?sh(n,1):S0[i]);
  B=T.map(n=>{const m=META[n];if(!m||!m.bl||!m.bl.length)return null;const S=new Set(m.bl);return(d,p)=>S.has(d+','+p)})}
const sig=()=>hash(canon([DATA,SN,META,PER]));
function applyTT(){if(TT&&TT.sig==sig()&&Array.isArray(TT.g)&&TT.g.length==NS){g=TT.g;rooms();STALE=0}else{g=[];R=[];STALE=TT?1:0}}

/* ---------- timetable solver ---------- */
const rnd=n=>Math.random()*n|0;
function init(){g=[];const fixed=[...Array(NS)].map(()=>new Array(35).fill(null));
  for(let s=0;s<NS;s++){const cells=fixed[s].slice(),free=[];for(let i=0;i<35;i++)if(cells[i]==null)free.push(i);
    for(let i=free.length-1;i>0;i--){const j=rnd(i+1);[free[i],free[j]]=[free[j],free[i]]}
    let fi=0;U.forEach((u,ui)=>{if(u.s!=s)return;for(let k=0;k<u.h;k++){const pos=free[fi++];if(pos==null)return;cells[pos]=ui;for(const o of u.secs)if(o!=s)fixed[o][pos]=ui}});
    for(let i=0;i<35;i++)if(cells[i]==null)cells[i]=-1;let k=0;g.push(PER.map(c=>cells.slice(k,k+=c)))}}
const linked=u=>u>=0&&U[u].secs.length>1;
function swapSet(s,a,b){const S=new Set([s]);let grow=true;while(grow){grow=false;for(const x of [...S])for(const pos of [a,b]){const u=g[x][pos.d][pos.p];if(linked(u))for(const y of U[u].secs)if(!S.has(y)){S.add(y);grow=true}}}return[...S]}
function tc(d,p){const c={},seenU=new Set();let x=0,a=0,sp=0,n=0;for(let s=0;s<NS;s++){const u=g[s][d][p];if(u<0)continue;const t=U[u].t,j=U[u].sj;
  if(c[t]!=null&&c[t]!==u)x+=10;c[t]=u;if(B[t]&&B[t](d,p))x+=10;if(seenU.has(u))continue;seenU.add(u);if(j=='حاسوب')a++;else if(j=='رياضة')sp++;else n++}
  return x+10*(Math.max(0,a-1)+Math.max(0,sp-1)+Math.max(0,n-17))}
function dc(s,d){const c={};let x=0,e=0;for(let p=0;p<PER[d];p++){const u=g[s][d][p];if(u<0)e=1;else{if(e)x+=2;c[u]=(c[u]||0)+1;if(c[u]>U[u].cap)x+=5}}return x}
function full(){let x=0;for(let d=0;d<5;d++){for(let p=0;p<PER[d];p++)x+=tc(d,p);for(let s=0;s<NS;s++)x+=dc(s,d)}return x}
function clash(){let x=0;for(let d=0;d<5;d++)for(let p=0;p<PER[d];p++)x+=tc(d,p)/10;return x}
function pick(){let d,p;for(let k=0;k<40;k++){d=rnd(5);p=rnd(7);if(tc(d,p)>0){const c={},L=[],A=[];for(let s=0;s<NS;s++){const u=g[s][d][p];if(u>=0){const t=U[u].t;A.push(s);(c[t]=c[t]||[]).push([s,u]);if(B[t]&&B[t](d,p))L.push(s)}}
  for(const t in c)if(new Set(c[t].map(x=>x[1])).size>1)L.push(...c[t].map(x=>x[0]));const Z=L.length?L:A;return[Z[rnd(Z.length)],d,p]}}return[rnd(NS),d,p]}
function doSwap(S,a,b){for(const x of S){const A=g[x];[A[a.d][a.p],A[b.d][b.p]]=[A[b.d][b.p],A[a.d][a.p]]}}
function solve(){init();const t0=Date.now();
for(let it=0;it<9e6;it++){if(it%3000==0){const f=full();if(f<=12||(clash()==0&&Date.now()-t0>3000)||Date.now()-t0>14000)break}
let s,d1,p1;if(Math.random()<.7)[s,d1,p1]=pick();else{s=rnd(NS);d1=rnd(5);p1=rnd(PER[d1])}
const d2=rnd(5),p2=rnd(PER[d2]);if(d1==d2&&p1==p2)continue;const a={d:d1,p:p1},b={d:d2,p:p2},S=swapSet(s,a,b);
const f=()=>{let v=tc(d1,p1)+tc(d2,p2);for(const x of S)v+=dc(x,d1)+(d1==d2?0:dc(x,d2));return v};const b0=f();
doSwap(S,a,b);if(f()>b0&&Math.random()>.003)doSwap(S,a,b)}
return clash()}
function rooms(){R=[...Array(NS)].map(()=>DAYS.map(()=>[]));
for(let d=0;d<5;d++){const pr={};for(let p=0;p<PER[d];p++){const used=new Set(),rest=[],tk=r=>used.has(r)?0:(used.add(r),1);
for(let s=0;s<NS;s++){const u=g[s][d][p];if(u<0)continue;const j=U[u].sj;let r=0;
if(j=='حاسوب')r=tk('مختبر الحاسوب')&&'مختبر الحاسوب';else if(j=='رياضة')r=tk('الساحة')&&'الساحة';else if(j=='كيمياء')r=tk('القاعة الذكية')&&'القاعة الذكية';
if(r)R[s][d][p]=r;else rest.push(s)}
for(const s of rest){const uu=g[s][d][p];if(linked(uu)&&U[uu].s!=s&&R[U[uu].s][d][p]){R[s][d][p]=R[U[uu].s][d][p];continue}let n=0;const f=k=>k&&!used.has(k)?k:0;n=f(pr[s])||f(s<16&&s+1);if(!n)for(let k=1;k<=16;k++)if(!used.has(k)){n=k;break}
if(n){used.add(n);pr[s]=n;R[s][d][p]='قاعة '+n}else if(tk('القاعة الذكية'))R[s][d][p]='القاعة الذكية';else R[s][d][p]='بلا قاعة'}}}}

function toast(m,kind){const t=$('toast');t.innerHTML=`<div class="${kind||''}">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',kind=='err'?6000:3200)}
function setSync(kind,text){const s=$('sync');s.className='pill '+kind;s.lastChild.textContent=text}
function saveLocal(){try{localStorage.setItem('sx',JSON.stringify({D:DATA,M:META,N:SN,S:ST,A:AT,G:GD,T:TT,TM:TMS,CU:CUR,PC,AB,F:STF,PH,O:OFF,L:LET}))}catch(e){}}
function readLocal(){try{const v=JSON.parse(localStorage.getItem('sx'));if(v&&Array.isArray(v.D))return v}catch(e){}return null}
const Q={},PG_={};
function q(path,fn){const p=(Q[path]||Promise.resolve()).then(fn).catch(fail);Q[path]=p;return p}
async function retry(fn){for(let i=0;;i++){try{return await fn()}catch(e){const c=e&&e.code;if((c=='unavailable'||c=='resource_exhausted')&&i<3){await new Promise(r=>setTimeout(r,700*(i+1)+Math.random()*500));continue}throw e}}}
function fail(e){const c=e&&e.code;toast(c=='invalid_argument'?'ليس لديك صلاحية تعديل البيانات':c=='quota_exceeded'?'امتلأت مساحة قاعدة البيانات، احذف بيانات قديمة':'تعذّر الحفظ، تحقق من الاتصال وأعد المحاولة','err')}
const upd=(ref,patch,whole)=>retry(()=>ref.update(patch)).catch(e=>{if(e&&e.code=='invalid_argument')return retry(()=>ref.set(whole()));throw e});
const P={
  cfg(){if(!DB)return saveLocal();q('cfg',()=>retry(()=>DB.doc('school/config').set({json:JSON.stringify({D:DATA,M:META,N:SN,TM:TMS,CU:CUR,PC,AB,YD})})))},
  tt(){if(!DB)return saveLocal();q('tt',()=>retry(()=>DB.doc('school/timetable').set({json:JSON.stringify(TT)})))},
  st(){if(!DB)return saveLocal();q('st',()=>retry(()=>DB.doc('school/students').set({list:ST})))},
  att(date,patch){if(!DB)return saveLocal();const r=DB.doc('attendance/'+date);q(r.path,()=>upd(r,{m:patch},()=>({m:{...(AT[date]||{})}})))},
  gr(id,sj){if(!DB)return saveLocal();const r=DB.doc('grades/'+id),val=JSON.parse(JSON.stringify(GD[id][sj])),whole=JSON.parse(JSON.stringify(GD[id]));PG_[id+'|'+sj]=val;q(r.path,()=>upd(r,{[sj]:val},()=>whole))},
  delGr(id){if(!DB)return saveLocal();q('grades/'+id,()=>retry(()=>DB.doc('grades/'+id).delete()))}
};
function guard(){if(RO){toast('لديك صلاحية العرض فقط، اطلب من مدير المدرسة صلاحية التعديل','err');return 1}return 0}
function refresh(){const a=document.activeElement;if(HOLD||(a&&$('main').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))){PEND=1;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(PEND&&!HOLD)refresh()},250));

function subscribe(){
  const err=e=>{setSync('off','انقطع الاتصال، أعد فتح الصفحة');toast('انقطع الاتصال بقاعدة البيانات','err')};
  DB.doc('school/config').onSnapshot(s=>{
    if(s.exists){try{const v=JSON.parse(s.data().json);DATA=v.D;META=v.M||{};setSN(v.N||SN0);TMS=v.TM||defTimes();CUR=v.CU||{};PC={...PC0,...(v.PC||{})};AB=+v.AB||20;YD=v.YD||clone(YD0);if(g.length)try{rooms()}catch(e){}}catch(e){}}else{DATA=clone(DATA0);META={};setSN(SN0);TMS=defTimes();CUR={};PC={...PC0}}
    seedMeta();build();applyTT();READY.cfg=1;refresh()},err);
  DB.doc('school/timetable').onSnapshot(s=>{let t=null;if(s.exists){try{t=JSON.parse(s.data().json)}catch(e){}}TT=t;applyTT();READY.tt=1;refresh()},err);
  DB.doc('school/students').onSnapshot(s=>{ST=s.exists?(s.data().list||[]).map(x=>({...x})):[];READY.st=1;refresh()},err);
  DB.collection('attendance').limit(1000).onSnapshot(qs=>{AT={};qs.docs.forEach(d=>{AT[d.id]={...((d.data()||{}).m||{})}});READY.at=1;refresh()},err);
  DB.collection('grades').limit(1000).onSnapshot(qs=>{GD={};const pend=PG_;qs.docs.forEach(d=>{const v=d.data()||{},o={};for(const k in v){const x=v[k];if(Array.isArray(x))o[k]=[...x];else if(x&&typeof x=='object')o[k]={...x}}GD[d.id]=o});for(const k in pend){const[id,sj]=k.split('|'),cur=(GD[id]||{})[sj];if(JSON.stringify(cur)===JSON.stringify(pend[k]))delete PG_[k];else(GD[id]=GD[id]||{})[sj]={...pend[k]}}READY.gd=1;refresh()},err);
}
function loadInto(v){DATA=v.D;META=v.M||{};setSN(v.N||[...SN0,...(v.X||[])]);ST=(v.S||[]).map(s=>({...s,id:s.id||uid()}));AT=v.A||{};GD=v.G||{};TT=v.T||null;TMS=v.TM||defTimes();CUR=v.CU||{};PC={...PC0,...(v.PC||{})};AB=+v.AB||20;if(v.F)STF=v.F;if(v.PH)PH=v.PH;if(v.O)OFF=v.O;if(v.L)LET=v.L;seedMeta();build();applyTT()}
async function boot(){
  mountShell();startShell();TMS=defTimes();seedMeta();build();SNAP=readSnap();
  let u=null,me=null,w=null;
  if(window.claude&&typeof claude.use=='function'){try{u=await claude.use('user')}catch(e){}if(u){try{me=await u.me();w=await u.can('data.write')}catch(e){}}}
  ADM=!!(me&&(me.isOwner||me.canEdit));OWN=!!(me&&me.isOwner);
  ME={name:me&&me.name||'',role:me?(me.isOwner?'مدير النظام — صلاحية كاملة':me.canEdit?'محرر — إضافة وتعديل':'لا يملك صلاحية الإدارة'):'غير مسجّل الدخول',av:me&&me.avatarUrl||''};paintMe();
  let r='';try{r=sessionStorage.getItem('role')||''}catch(e){}
  lgTab(ADM?'a':'s');
  if(r=='a'&&ADM)showAdmin();else if((r=='s'||r=='t')&&SNAP){ROLE=r;showPortal()}
  if(!ADM)return;
  if(w===false&&!me.canEdit&&!me.isOwner)RO=1;
  setSync('','جارٍ الاتصال');
  let db=null;try{db=await claude.use('db')}catch(e){}
  if(db){DB=db;LOC=readLocal();setSync('ok','متصل — بيانات مشتركة');subscribe();if(OWN)subscribeOwner();else READY.stf=READY.let=READY.off=1;render();return}
  const v=readLocal();if(v)loadInto(v);READY={cfg:1,tt:1,st:1,at:1,gd:1,stf:1,let:1,off:1};setSync('','محفوظ على هذا الجهاز فقط');
  if(!TT)gen(1);else render()}

/* Page model shared by PDF, print file, Word and Excel:
   {title, sub, rows, orient, paper, fs(pt), ww, xw, rh, hr, brand, info, note, foot, sheet}
   cell = text or {v, h, cs, rs, l, red, bg, b, fz, sep} */
const cO=c=>c&&typeof c=='object'?c:{v:c==null?'':String(c)};
const stdBrand=m=>({right:{lines:[{t:'إدارة إعدادية سيناء للبنين',sz:12,b:1},{t:'المديرية العامة لتربية بغداد / الرصافة الأولى',sz:9},{t:'العام الدراسي '+YR,sz:9}]},center:{lines:[{t:m.title,sz:13,b:1},...(m.sub?[{t:m.sub,sz:10}]:[])]},left:{img:LOGO_S,h:16}});
const footOf=m=>m.foot||['',m.sign||SIGN];
function modelHTML(m,cls){const fs=m.fs||9;let h=`<table class="mt ${cls||m.cls||''}" style="font-size:${fs}pt">`;
  for(const r of m.rows){const sep=r.length==1&&cO(r[0]).sep;h+='<tr>';for(const c0 of r){const c=cO(c0),tg=c.h?'th':'td';
    const st=[c.nb?'border:none;background:transparent':'',c.bg?`background:${c.bg};color:#111`:'',c.fz?`font-size:${(fs*c.fz).toFixed(1)}pt`:'',c.b&&!c.h?'font-weight:700':''].filter(Boolean).join(';');
    h+=`<${tg}${c.cs>1?` colspan="${c.cs}"`:''}${c.rs>1?` rowspan="${c.rs}"`:''} class="${(c.l?'l ':'')+(c.red?'red ':'')+(sep?'sep':'')}"${st?` style="${st}"`:''}>${sep?'':esc(c.v).replace(/\n/g,'<br>')}</${tg}>`}h+='</tr>'}return h+'</table>'}
const slotHTML=s=>!s?'':(s.img?`<img src="${s.img}" alt="" style="height:${s.h||16}mm;width:auto;display:inline-block">`:'')+(s.lines||[]).map(l=>`<div style="font-size:${l.sz||10}pt;font-weight:${l.b?700:400};color:${l.c||'#000'};line-height:1.4">${esc(l.t)}</div>`).join('');
const brandHTML=b=>{const w=Math.round((b.w||.28)*100);return`<table class="nb" style="margin-bottom:6px"><tr><td style="width:${w}%;text-align:center">${slotHTML(b.right)}</td><td style="text-align:center">${slotHTML(b.center)}</td><td style="width:${w}%;text-align:center">${slotHTML(b.left)}</td></tr></table>`};
const infoHTML=i=>!i?'':`<table class="nb" style="margin:4px 0 10px"><tr><td style="width:42%;text-align:center;font-size:24pt;font-weight:700;color:${i.c||'#1f3a8a'}">${esc(i.big)}</td><td style="text-align:right">${i.lines.map(([k,v])=>`<div style="font-size:13pt;margin:5px 0"><span style="display:inline-block;min-width:95px;font-weight:700">${esc(k)} :</span> ${esc(v)}</div>`).join('')}</td></tr></table>`;
const footHTML=f=>`<table class="nb" style="margin-top:12px"><tr>${f.map(t=>`<td style="text-align:center;font-weight:700;font-size:12pt;line-height:1.7">${esc(t).replace(/\n/g,'<br>')}</td>`).join('')}</tr></table>`;

  if(/^\d{4}$/.test(s))return s;
  let m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m)return m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]);
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return m[3]+'-'+pad2(m[2])+'-'+pad2(m[1]);
  return''}

function ymd(a,b){let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}return{y,m,d}}

async function kRead(file){if(!file||guard())return;try{if(/\.docx$/i.test(file.name)){toast('جارٍ قراءة الملف…');const F=await parseForms(await file.arrayBuffer());if(F.length){KIMP={name:file.name,forms:F,over:1};HOLD=1;render();return}}const rows=await readRows(file);const p=kParse(rows);if(!p.recs.length)return toast('لم أجد جدولاً فيه عمود للاسم. تأكد أن الملف يحوي صف عناوين مثل «الاسم الرباعي».','err');KIMP={name:file.name,...p};HOLD=1;render()}catch(e){toast(e=='type'?'نوع الملف غير مدعوم، استخدم xlsx أو docx':'تعذّرت قراءة الملف','err')}}
function kParse(rows,over){const heads={},recs=[];let map=null;
  for(const r of rows){const cells=(r||[]).map(c=>String(c??'').replace(/\s+/g,' ').trim());
    const fs=cells.map(c=>fieldOfHeader(c)),hits=fs.filter(Boolean);
    if(hits.length>=2&&fs.includes('name')&&cells.every(c=>!c||c.length<60)){map=cells.map(c=>{const k=hk(c);if(c)heads[k]=heads[k]||{t:c,f:fieldOfHeader(c)};return k});continue}
    if(!map)continue;const o={};map.forEach((k,i)=>{const f=over&&over[k]!=null?over[k]:(heads[k]||{}).f;if(f&&cells[i])o[f]=o[f]?o[f]+' ، '+cells[i]:cells[i]});
    if(!o.name||!/[ء-ي]{2}/.test(o.name)||fieldOfHeader(o.name)=='name')continue;
    for(const k of DATEF)if(o[k])o[k]=isoOf(o[k])||o[k];if(o.ord)o.ord=String(+digits(o.ord)||'');recs.push(o)}
  return{heads,recs,rows}}

async function pdfBlob(D){const enc=new TextEncoder(),parts=[];let len=0;const offs=[];const push=b=>{if(typeof b=='string')b=enc.encode(b);parts.push(b);len+=b.length};

  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Count '+n+' /Kids ['+D.pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>');

    obj(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>');
    obj(cid,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    obj(iid,'<< /Type /XObject /Subtype /Image /Width '+c.width+' /Height '+c.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n',jpg,'\nendstream')}
  const total=3+3*n,xo=len;let xr='xref\n0 '+total+'\n0000000000 65535 f \n';for(let i=1;i<total;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';push(xr+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');

function sexWords(x,fem){x=String(x??'');if(fem)for(const[a,b]of SXW)x=x.split(a).join(b);

function tplFill(L,{s,t}){if(t){const fem=tSex(t)=='f';L={...L};['to','to2','body','tbl','after','sig2','att','note'].forEach(k=>{if(L[k])L[k]=sexWords(L[k],fem)})}const D=L.date?fmtD(L.date):'';const rep={};

function tplLeave(L,tn){const ti=T.findIndex(n=>n==tn||sameName(n,tn));if(ti<0||!g.length)return L;const d=new Date((L.date||TD)+'T12:00').getDay();if(d>4)return L;

let SHH=[];
/* the target per day: as even as possible, never above that day's periods */
function dayT(H){const t=[0,0,0,0,0];let r=Math.min(H,PER.reduce((a,b)=>a+b,0));while(r>0){let k=-1;for(let d=0;d<5;d++)if(t[d]<PER[d]&&(k<0||t[d]<t[k]||(t[d]==t[k]&&PER[d]>PER[k])))k=d;if(k<0)break;t[k]++;r--}return t}
let DTG=[];
init=function(){g=[];SHH=secH();DTG=SHH.map(H=>{const t=dayT(H);return[Math.min(...t),Math.max(...t)]});const fixed=[...Array(NS)].map(()=>new Array(35).fill(null));
  for(let s=0;s<NS;s++){const cells=fixed[s].slice();
    /* fill each day from the first period, day by day following the balanced target, then shuffle within the week */
    const t=dayT(SHH[s]),free=[];for(let d=0;d<5;d++)for(let p=0;p<t[d];p++)if(cells[d*7+p]==null)free.push(d*7+p);
    for(let d=0;d<5;d++)for(let p=t[d];p<PER[d];p++)if(cells[d*7+p]==null)free.push(d*7+p);
    const n0=Math.min(free.length,SHH[s]);for(let i=n0-1;i>0;i--){const j=rnd(i+1);[free[i],free[j]]=[free[j],free[i]]}
    let fi=0;U.forEach((u,ui)=>{if(u.s!=s)return;for(let k=0;k<u.h;k++){let pos=free[fi++];while(pos!=null&&cells[pos]!=null)pos=free[fi++];if(pos==null)return;cells[pos]=ui;for(const o of u.secs)if(o!=s)fixed[o][pos]=ui}});
